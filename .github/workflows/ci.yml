name: SyndiRelay standalone migration verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syndirelay-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install only distribution renderer dependencies (never download Chromium)
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: npm ci
      - name: Test all original Go platform compilers and publisher modules
        run: go test ./...
      - name: Test copied image renderer and browser extension
        run: npm run test:renderers && npm run test:extension
      - name: Build independent SyndiRelay executable
        shell: bash
        run: |
          mkdir -p .build
          case "${{ runner.os }}" in Windows) suffix=.exe;; *) suffix=;; esac
          go build -trimpath -o ".build/syndirelay${suffix}" ./cmd
      - name: Verify README Quick Start on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          printf '# Hello SyndiRelay\n\nMy first article.\n' > .build/example.md
          ./.build/syndirelay compile --file .build/example.md --platform devto > .build/compiled.json
          node -e 'const x=JSON.parse(require("fs").readFileSync(".build/compiled.json","utf8")); if(x.platform!=="devto" || x.title!=="Hello SyndiRelay" || !x.markdown.includes("My first article.") || !x.contentHash) process.exit(1)'
      - name: Verify README Quick Start on Windows PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Content -Path .build/example.md -Encoding utf8 -Value "# Hello SyndiRelay`n`nMy first article."
          .\.build\syndirelay.exe compile --file .build/example.md --platform devto > .build/compiled.json
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
          $compiled = Get-Content -Raw .build/compiled.json | ConvertFrom-Json
          if ($compiled.platform -ne 'devto' -or $compiled.title -ne 'Hello SyndiRelay' -or -not $compiled.markdown.Contains('My first article.') -or -not $compiled.contentHash) {
            throw 'Quick Start output does not match the README'
          }
      - name: Verify Go-native MCP UI and installer wizard
        shell: bash
        run: |
          node --check extension/popup/mcp-connection.js
          python scripts/test_package_installer.py
      - name: Exercise isolated Go-native Tunnel lifecycle
        if: runner.os == 'Linux'
        run: python3 scripts/test_mcp_tunnel_lifecycle.py
      - name: Build native portable stage and prepare Qt IFW installer
        shell: bash
        run: |
          python scripts/package_release.py --stage .build/native-stage --qa-only
          case "${{ runner.os }}" in Linux) target=linux ;; Windows) target=windows ;; macOS) target=darwin ;; esac
          version="$(python -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')"
          python scripts/package_installer.py --stage .build/native-stage --version "$version" --os "$target" --output .build/qt-installer-tree --prepare-only
      - name: Verify release stage has Node and no PowerShell dependency
        shell: bash
        run: |
          case "${{ runner.os }}" in Windows) node=.build/native-stage/bin/node.exe;; *) node=.build/native-stage/bin/node;; esac
          test -f "$node"
          "$node" --version
          test -s .build/native-stage/THIRD_PARTY_LICENSES/runtime/node/LICENSE
          python -c 'from pathlib import Path; p=Path(".build/native-stage"); assert not list(p.rglob("*.ps1")), "PowerShell in runtime payload"'
      - name: Smoke-test a brand-new Mermaid PNG with the bundled runtime and system Edge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Content -Path .build/mermaid-fresh.mmd -Value 'flowchart LR; A[Fresh] --> B[Installed Edge]' -Encoding ascii
          $env:PATH = 'C:\Windows\System32;C:\Windows'
          & .build/native-stage/bin/node.exe .build/native-stage/renderers/node/publishing-image.mjs --kind mermaid --input .build/mermaid-fresh.mmd --output .build/mermaid-fresh.png --width 800 --scale 1
          if ($LASTEXITCODE -ne 0 -or !(Test-Path .build/mermaid-fresh.png)) { throw "Bundled Mermaid renderer failed without npm/npx or a browser download" }
          if ((Get-Item .build/mermaid-fresh.png).Length -lt 100) { throw "Mermaid renderer returned empty PNG" }
      - name: Check no old risky transport dependencies
        shell: bash
        run: |
          ! grep -E '(fhttp|tls-client)' go.mod go.sum
          test -s package-lock.json
          test -s .github/migration/SOURCE_SHA256.txt
